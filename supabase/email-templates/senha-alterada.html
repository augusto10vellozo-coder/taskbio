<!doctype html>
<html lang="pt-BR">
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f4f3ef;
      font-family:
        -apple-system,
        Segoe UI,
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      color: #1c1b19;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f4f3ef; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 520px; background: #ffffff; border-radius: 16px; overflow: hidden"
          >
            <tr>
              <td style="background: #1e4d3b; padding: 20px 28px">
                <span
                  style="color: #ffffff; font-size: 18px; font-weight: 700; letter-spacing: 0.2px"
                  >TaskBio</span
                >
                <span style="color: #bfd6c8; font-size: 12px; display: block; margin-top: 2px"
                  >organização de vida saudável</span
                >
              </td>
            </tr>
            <tr>
              <td style="padding: 32px 28px 8px 28px">
                <h1 style="margin: 0 0 12px 0; font-size: 22px; line-height: 1.3; color: #1c1b19">
                  Sua senha foi alterada
                </h1>
                <p style="margin: 0 0 20px 0; font-size: 15px; line-height: 1.6; color: #4a4742">
                  A senha da conta <strong>{{ .Email }}</strong> foi alterada com sucesso. Se foi
                  você, não precisa fazer nada.
                </p>
                <p style="margin: 0 0 24px 0; font-size: 15px; line-height: 1.6; color: #4a4742">
                  Se não reconhece esta alteração, redefina sua senha imediatamente e fale com a
                  gente.
                </p>
                <p style="margin: 0 0 24px 0">
                  <a
                    href="{{ .SiteURL }}/esqueci-senha"
                    style="
                      display: inline-block;
                      background: #1e4d3b;
                      color: #ffffff;
                      text-decoration: none;
                      font-weight: 600;
                      font-size: 15px;
                      padding: 12px 22px;
                      border-radius: 10px;
                    "
                    >Redefinir minha senha</a
                  >
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 28px 28px 28px; border-top: 1px solid #e7e5df">
                <p style="margin: 0; font-size: 12px; line-height: 1.6; color: #6b6862">
                  Contato: contatotaskbio@gmail.com
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
