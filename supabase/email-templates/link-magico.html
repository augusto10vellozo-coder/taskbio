<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background:#F4F3EF;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1C1B19;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F3EF;padding:32px 16px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FFFFFF;border-radius:16px;overflow:hidden;">
          <tr><td style="background:#1E4D3B;padding:20px 28px;">
            <span style="color:#FFFFFF;font-size:18px;font-weight:700;letter-spacing:.2px;">TaskBio</span>
            <span style="color:#BFD6C8;font-size:12px;display:block;margin-top:2px;">organização de vida saudável</span>
          </td></tr>
          <tr><td style="padding:32px 28px 8px 28px;">
            <h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;color:#1C1B19;">Seu link de acesso</h1>
            <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#4A4742;">Use o botão abaixo para entrar no TaskBio sem digitar senha. O link expira em pouco tempo e só funciona uma vez.</p>
            <p style="margin:0 0 24px 0;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1E4D3B;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:15px;padding:12px 22px;border-radius:10px;">Entrar no TaskBio</a>
            </p>
            <p style="margin:0 0 24px 0;font-size:13px;line-height:1.6;color:#6B6862;">Se você não pediu este link, ignore esta mensagem.</p>
          </td></tr>
          <tr><td style="padding:20px 28px 28px 28px;border-top:1px solid #E7E5DF;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:#6B6862;">Dúvidas? Fale com a gente em contatotaskbio@gmail.com.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
